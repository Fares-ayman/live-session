name: live_session_app
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=2.17.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.5.3

  flutter_screenutil: ^5.9.3

  cached_network_image: ^3.4.1
  flutter_secure_storage: ^9.2.4

  gap: ^3.0.1
  auto_size_text: ^3.0.0

  cupertino_icons: ^1.0.6
  get: ^4.7.2
  flutter_launcher_icons: ^0.14.3
  flutter_localization: ^0.3.3

  fluttertoast: ^9.0.0
  webview_flutter: ^4.13.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner:
  flutter_gen_runner:

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/

  fonts:
    - family: Montserrat Arabic
      fonts:
        - asset: assets/fonts/Montserrat-Arabic_Regular.otf
        - asset: assets/fonts/Montserrat-Arabic_Bold.otf
          weight: 700
        - asset: assets/fonts/Montserrat-Arabic_Medium.otf
          weight: 500
        - asset: assets/fonts/Montserrat-Arabic_Medium.otf
          weight: 500
          style: italic
        - asset: assets/fonts/Montserrat-Arabic_SemiBold.otf
          weight: 700
        - asset: assets/fonts/Montserrat-Arabic_Bold.otf
          weight: 700
          style: italic
        - asset: assets/fonts/Montserrat-Arabic_Light.otf
          weight: 300
        - asset: assets/fonts/Montserrat-Arabic_Light.otf
          weight: 300
          style: italic
        - asset: assets/fonts/Montserrat-Arabic_Black.otf
          weight: 900
        - asset: assets/fonts/Montserrat-Arabic_Black.otf
          weight: 900
          style: italic
        - asset: assets/fonts/Montserrat-Arabic_Thin.otf
          weight: 100
        - asset: assets/fonts/Montserrat-Arabic_Thin.otf
          weight: 100
          style: italic
# when change any images, you need to run this command
# (dart run build_runner build)
flutter_gen:
  integrations:
    flutter_svg: true

# when change any images, you need to run this command
# (dart run flutter_launcher_icons)
flutter_launcher_icons:
  ios: true
  remove_alpha_ios: true
  android: "launcher_icon"
  image_path_ios: "assets/images/logo.png"
  image_path: "assets/images/logo.png" # Path to your icon image
  adaptive_icon_foreground: "assets/images/logo.png" # Path to foreground image
  # adaptive_icon_background: "#162B45" # Change this to your desired color code
